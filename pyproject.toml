[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhands-swarm"
version = "0.1.0"
description = "State-machine driven issue orchestration for OpenHands Swarm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenHands Swarm" }]
dependencies = [
  "openhands-ai>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openhands-swarm = "openhands_swarm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
