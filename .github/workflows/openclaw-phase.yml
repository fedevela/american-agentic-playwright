name: OpenClaw SDLC Phase Router

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  sdnc-phase-router:
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      LABEL_NAME: ${{ github.event.label.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine phase from label
        id: phase
        shell: bash
        run: |
          LABEL="${LABEL_NAME}"
          
          # Map Kabbalistic phase labels to SDLC phases
          case "$LABEL" in
            phase:keter)
              PHASE=1
              WORKFLOW="discussion"
              ;;
            phase:chokhmah|phase:binah|phase:chesed)
              PHASE=2
              WORKFLOW="discussion"
              ;;
            phase:gevurah)
              PHASE=3
              WORKFLOW="discussion"
              ;;
            phase:tiferet)
              PHASE=4
              WORKFLOW="discussion"
              ;;
            phase:netzach)
              PHASE=5
              WORKFLOW="workflow"
              ;;
            phase:hod)
              PHASE=6
              WORKFLOW="workflow"
              ;;
            phase:yesod-orchestration)
              PHASE=7
              WORKFLOW="workflow"
              ;;
            phase:yesod-embodiment)
              PHASE=8
              WORKFLOW="workflow"
              ;;
            phase:malkhut)
              PHASE=9
              WORKFLOW="workflow"
              ;;
            *)
              PHASE=0
              WORKFLOW="skip"
              ;;
          esac
          
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW" >> $GITHUB_OUTPUT
          echo "Label '$LABEL' mapped to Phase $PHASE ($WORKFLOW)"

      - name: Skip unsupported labels
        if: steps.phase.outputs.workflow == 'skip'
        run: echo "Unsupported label. Skipping."

      - name: Build discussion prompt (Phases 1-4)
        if: steps.phase.outputs.workflow == 'discussion'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/microagents"
          sed "s#<ISSUE_NUMBER>#${ISSUE_NUMBER}#g" ".openhands/microagents/phase_0${steps.phase.outputs.phase}_*.md" > "$RUNNER_TEMP/prompt.md" 2>/dev/null || true
          cat <<EOF >> "$RUNNER_TEMP/prompt.md"

          ## Runtime Context

          - Repository: ${{ github.repository }}
          - Issue number: #${ISSUE_NUMBER}
          - Trigger label: ${{ github.event.label.name }}
          - Phase: ${{ steps.phase.outputs.phase }}
          - Mode: headless
          EOF

      - name: Build workflow prompt (Phases 5-9)
        if: steps.phase.outputs.workflow == 'workflow'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/microagents"
          sed "s#<ISSUE_NUMBER>#${ISSUE_NUMBER}#g" ".openhands/microagents/phase_0${steps.phase.outputs.phase}_*.md" > "$RUNNER_TEMP/prompt.md" 2>/dev/null || true
          cat <<EOF >> "$RUNNER_TEMP/prompt.md"

          ## Runtime Context

          - Repository: ${{ github.repository }}
          - Issue number: #${ISSUE_NUMBER}
          - Trigger label: ${{ github.event.label.name }}
          - Phase: ${{ steps.phase.outputs.phase }}
          - Mode: headless
          - Workflow: Code generation & PR
          EOF

      - name: Trigger OpenHands workflow (Phases 5-9)
        if: steps.phase.outputs.workflow == 'workflow'
        uses: All-Hands-AI/openhands-github-action@v2
        with:
          prompt: ${{ runner.temp }}/prompt.md
          repository: ${{ github.repository }}
          selected-branch: ${{ github.event.repository.default_branch }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openhands-api-key: ${{ secrets.OPENHANDS_API_KEY }}
          poll: "true"
          timeout-seconds: "1200"
          poll-interval-seconds: "20"

      - name: Comment on issue (Phases 1-4)
        if: steps.phase.outputs.workflow == 'discussion'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prompt = fs.readFileSync('${{ runner.temp }}/prompt.md', 'utf8');
            const comment = `## Phase ${{ steps.phase.outputs.phase }} Discussion\n\n${prompt}`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: process.env.ISSUE_NUMBER,
              body: comment
            });